<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kards卡组展示页面</title>
    <style>
/* ==========全局基础========== */
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}
.bg-container {
    width: 100%;
    height: 100%;
    background-image: url("picture/Image.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
    position: relative;
}
.author-text {
    position: absolute;
    bottom: 40px;
    right: 60px;
    color: #ffffff;
    font-size: 32px;
    z-index: 8;
}
.btn-group {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 10;
}
/* 通用菜单按钮样式 */
.menu-btn {
    display: block;
    width: 200px;
    height: 50px;
    background-color: #55585a;
    font-size: 20px;
    color: #fff;
    text-decoration: none;
    text-align: center;
    line-height: 50px;
    margin-bottom: 10px;
    border: none;
    cursor: pointer;
    transition: transform 0.1s ease;
}
/* 按钮按下缩小效果 */
.menu-btn:active {
    transform: scale(0.9);
}
.menu-btn:hover {
    background-color: #ff6700;
}

/* ==========签到面板========== */
.sign-panel {
    display: none;
    width: 200px;
    background: #2b2b2b;
    padding: 12px;
    border-radius: 4px;
    color: #fff;
    margin-bottom: 10px;
    box-sizing: border-box;
}
.sign-input {
    width: 100%;
    box-sizing: border-box;
    height: 40px;
    padding: 0 12px;
    font-size: 15px;
    background: #3a3a3a;
    border: 1px solid #555;
    border-radius: 4px;
    color: #fff;
    outline: none;
    margin-bottom: 10px;
}
.sign-confirm-btn {
    width: 100%;
    height: 40px;
    background: #ff6700;
    color: #fff;
    font-size: 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-bottom: 12px;
}
.sign-count {
    font-size: 13px;
    color: #ccc;
}
.sign-list {
    display: none;
    max-height: 200px;
    overflow-y: auto;
    background: #333;
    padding: 8px;
    font-size: 13px;
}

/* ==========公告弹窗通用遮罩样式模板========== */
.notice-modal-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 9997;
    align-items: center;
    justify-content: center;
}
.notice-modal-box {
    width: 90%;
    max-width: 520px;
    background: #2b2b2b;
    color: #fff;
    border-radius: 6px;
    padding: 20px;
    box-sizing: border-box;
}
.notice-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #444;
}
.notice-close-btn {
    background: none;
    border: none;
    color: #aaa;
    font-size: 24px;
    cursor: pointer;
}

/* ==========卡组【中央弹窗核心】========== */
.deck-modal-mask{
    display:none;
    position:fixed;
    inset:0;                     /* 铺满全屏 */
    background:rgba(0,0,0,0.7);  /* 黑色半透明遮罩 */
    z-index:9996;
    align-items:center;
    justify-content:center;
}
.deck-modal-box{
    width:92%;
    max-width:1200px;   /* 弹窗最大宽度 */
    max-height:85vh;    /* 弹窗最大高度占视口85%，避免超出屏幕 */
    background:#2b2b2b;
    color:#fff;
    border-radius:8px;
    display:flex;
    flex-direction:column;
    overflow:hidden;    /* 内部滚动，盒子本身不溢出 */
}
.deck-modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    border-bottom:1px solid #444;
}
.deck-modal-close{
    background:none;
    border:none;
    color:#aaa;
    font-size:24px;
    cursor:pointer;
}
/* 弹窗内容区：设置overflow-y:auto，实现垂直滚动条 */
.deck-modal-body{
    padding:16px 18px;
    overflow-y:auto;
    flex:1;
}
/* 响应式网格：auto-fill自动填充，最小宽度320px，自动1~3列 */
.deck-grid-wrap{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(320px,1fr));
    gap:14px;
}
.deck-input {
    width: 100%;
    box-sizing: border-box;
    background: #3a3a3a;
    border: 1px solid #555;
    color: #fff;
    padding: 8px;
    margin-bottom: 8px;
    border-radius: 4px;
}
.deck-textarea {
    min-height: 100px;
    resize: vertical;
}
.deck-item {
    border: 1px solid #444;
    padding: 12px;
    border-radius: 4px;
}
/* 置顶卡组高亮边框 */
.deck-item.top-deck{
    border:2px solid #ff6700;
    background:#382c24;
}
.deck-btn-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
}
.deck-btn {
    padding: 4px 8px;
    font-size: 12px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
}
.btn-copy {background:#4488dd;color:#fff;}
.btn-del-own {background:#dd8822;color:#fff;}
.btn-del-admin {background:#dd3333;color:#fff;}
.btn-set-top{background:#22bb55;color:#fff;}
.fav-btn{
    background:#444;
    color:#fff;
    border:none;
    padding:4px 8px;
    margin:0 4px;
    cursor:pointer;
    border-radius:3px;
    font-size:12px;
}

/* ==========管理员密码弹窗========== */
#adminPwdMask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: 9999;
    align-items: center;
    justify-content: center;
}
.admin-trigger-inner {
    background: #fff;
    color: #111;
    padding: 22px;
    border-radius: 6px;
    width: 320px;
    max-width: 90%;
    box-sizing: border-box;
}
.pwd-input {
    width: 100%;
    box-sizing: border-box;
    height: 42px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 0 12px;
    margin: 12px 0;
    font-size: 16px;
}
.admin-btn-row {
    display: flex;
    gap: 10px;
}
.admin-confirm,.admin-close {
    flex: 1;
    height: 40px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
.admin-confirm {
    background: #ff6700;
    color: white;
}
.admin-close {
    background: #555;
    color: white;
}
#clearSignBtn {display: none;width: 100%;box-sizing: border-box;}
#clearSignBtn.active {display: block;}

/* ==========公告编辑区域========== */
.admin-notice-area {
    margin-top: 12px;
    display: none;
}
.admin-notice-area.active {
    display: block;
}
textarea.notice-edit {
    width: 100%;
    min-height: 100px;
    background: #3a3a3a;
    color: #fff;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 8px;
    box-sizing: border-box;
}
.corner-img {
    width: 240px;
    height: 302px;
    z-index: 9;
    object-fit: contain;
    cursor: pointer;
}

/* ==========维护模式遮罩========== */
#maintainMask{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:99999;
    color:#fff;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
}

/* ==========投票弹窗========== */
.poll-mask{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    z-index:9998;
    align-items:center;
    justify-content:center;
}
.poll-box{
    width:90%;
    max-width:500px;
    background:#2b2b2b;
    color:#fff;
    border-radius:6px;
    padding:20px;
    box-sizing:border-box;
    max-height:85vh;
    overflow-y:auto;
}
.poll-close{
    float:right;
    font-size:24px;
    background:none;
    border:none;
    color:#aaa;
    cursor:pointer;
}
.poll-option-item{
    padding:10px;
    border:1px solid #555;
    margin:6px 0;
    border-radius:4px;
    cursor:pointer;
}
.poll-option-item:hover{
    background:#444;
}
.poll-select-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}
.poll-box select{
    flex:1;
    padding:6px;
    background:#3a3a3a;
    color:#fff;
    border:1px solid #555;
    border-radius:4px;
}
    </style>
</head>
<body>
    <!-- 维护模式全屏遮罩 -->
    <div id="maintainMask">
        <h1>站点正在更新维护中</h1>
        <p>请稍后再来访问本网站</p>
        <div style="margin-top:20px"><input class="pwd-input" id="bypassMaintainPwd" placeholder="管理员密码可绕过维护"></div>
        <button class="menu-btn" id="bypassMaintainBtn">管理员绕过维护</button>
    </div>

    <!-- 公告弹窗 -->
    <div class="notice-modal-mask" id="noticeModalMask">
        <div class="notice-modal-box">
            <div class="notice-modal-header">
                <h4>📢公告</h4>
                <button class="notice-close-btn" id="noticeCloseBtn">×</button>
            </div>
            <div id="noticeShowContent"></div>
            <div class="admin-notice-area" id="adminNoticeWrap">
                <textarea class="notice-edit" id="noticeEditInput"></textarea>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <button class="menu-btn" style="width:auto;height:36px;line-height:36px;font-size:14px;" id="saveNoticeBtn">保存公告</button>
                    <button class="menu-btn" style="width:auto;height:36px;line-height:36px;font-size:14px;background:#c0392b;" id="clearNoticeBtn">清空公告</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========卡组中央弹窗DOM结构========== -->
    <div class="deck-modal-mask" id="deckModalMask">
        <div class="deck-modal-box">
            <div class="deck-modal-header">
                <h3>📚卡组管理</h3>
                <button class="deck-modal-close" id="deckModalClose">×</button>
            </div>
            <!-- body区域带垂直滚动条 -->
            <div class="deck-modal-body">
                <h4>添加新卡组</h4>
                <input class="deck-input" id="deckNameInput" placeholder="卡组名称（必填）">
                <textarea class="deck-input deck-textarea" id="deckCodeInput" placeholder="粘贴卡组代码"></textarea>
                <button class="menu-btn" style="width:100%;height:40px;line-height:40px;" id="addDeckBtn">提交卡组</button>
                <hr style="border-color:#444;margin:16px 0;">
                <h4>卡组列表</h4>
                <!-- 响应式网格容器，自动1‑3列 -->
                <div class="deck-grid-wrap" id="deckListWrap"></div>
            </div>
        </div>
    </div>

    <!-- 管理员密码弹窗 -->
    <div id="adminPwdMask">
        <div class="admin-trigger-inner">
            <h3>请输入密码</h3>
            <input class="pwd-input" id="secretPwdInput" type="password" placeholder="管理员密码">
            <div class="admin-btn-row">
                <button class="admin-confirm" id="pwdConfirm">确认</button>
                <button class="admin-close" id="pwdMaskClose">关闭</button>
            </div>
        </div>
    </div>

    <!-- 投票弹窗 -->
    <div class="poll-mask" id="pollMask">
        <div class="poll-box" id="pollBox"></div>
    </div>

    <!-- 主背景页面 -->
    <div class="bg-container">
        <div class="author-text">作者：生而峥嵘</div>
        <div style="position:absolute;top:10px;right:32.5px;text-align:right;">
            <img class="corner-img" src="picture/erweima.png">
            <div id="adminTipText" style="color:#4cd964;font-weight:bold;font-size:14px;display:none;margin-top:4px;">✅已获得管理员权限</div>
        </div>

        <div class="btn-group">
            <a class="menu-btn" href="https://karsenal.netlify.app/">kards军械库</a>
            <a class="menu-btn" id="signToggleBtn" href="#">签到</a>
            <div class="sign-panel" id="signPanel">
                <input type="text" class="sign-input" id="nicknameInput" placeholder="输入群昵称">
                <button class="sign-confirm-btn" id="confirmSignBtn">确认签到</button>
                <div class="sign-count">今日已签到：<span id="signCount">0</span> 人</div>
                <div class="sign-list" id="signList"></div>
                <button class="menu-btn" id="clearSignBtn">清空今日签到</button>
            </div>
            <a class="menu-btn" id="noticeToggleBtn" href="#">群公告</a>
            <a class="menu-btn" id="deckToggleBtn" href="#">卡组管理</a>
            <a class="menu-btn" id="pollToggleBtn" href="#">参与投票</a>
            <a class="menu-btn" href="https://ohminecraftlauncher.github.io/DIY/">DIY卡牌</a>
            <button class="menu-btn" id="maintainSwitchBtn" style="display:none;">切换维护模式</button>
        </div>
    </div>

<script>
    //====================全局常量&变量====================
    const API_BASE = "https://mengdi.de5.net"; //后端接口地址
    const ADMIN_PWD = 'mengdi12345678';        //管理员密码
    const DECK_FAV_KEY = "kards_deck_fav";     //localStorage收藏key

    //生成本地唯一用户ID，存在浏览器本地存储，用来区分不同用户
    let userId = localStorage.getItem("local_user_id");
    if(!userId){
        userId = crypto.randomUUID();
        localStorage.setItem("local_user_id",userId);
    }

    let isAdmin = false;       //是否管理员标记
    let qrClickCount = 0;     //二维码点击计数（管理员后门触发）
    let signBtnClickCount = 0;//签到按钮点击计数
    let triggerTimer = null;
    const TIME_LIMIT = 10000; //后门触发时间窗口10秒

    //====================DOM元素一次性获取，减少重复查询====================
    const deckModalMask = document.getElementById("deckModalMask");
    const deckModalClose = document.getElementById("deckModalClose");
    const deckToggleBtn = document.getElementById("deckToggleBtn");
    const deckNameInput = document.getElementById("deckNameInput");
    const deckCodeInput = document.getElementById("deckCodeInput");
    const addDeckBtn = document.getElementById("addDeckBtn");
    const deckListWrap = document.getElementById("deckListWrap");

    const adminPwdMask = document.getElementById('adminPwdMask');
    const secretPwdInput = document.getElementById('secretPwdInput');
    const pwdConfirm = document.getElementById('pwdConfirm');
    const pwdMaskClose = document.getElementById('pwdMaskClose');
    const clearSignBtn = document.getElementById('clearSignBtn');
    const signToggleBtn = document.getElementById('signToggleBtn');
    const maintainMask = document.getElementById('maintainMask');
    const bypassMaintainPwd = document.getElementById('bypassMaintainPwd');
    const bypassMaintainBtn = document.getElementById('bypassMaintainBtn');
    const maintainSwitchBtn = document.getElementById('maintainSwitchBtn');
    const adminTipText = document.getElementById("adminTipText");
    const qrImg = document.querySelector('.corner-img');

    const signPanel = document.getElementById('signPanel');
    const confirmSignBtn = document.getElementById('confirmSignBtn');
    const nicknameInput = document.getElementById('nicknameInput');
    const signCountEl = document.getElementById('signCount');
    const signList = document.getElementById('signList');
    const today = new Date().toISOString().split('T')[0];
    const STORAGE_KEY = 'group_sign_' + today;

    const noticeToggleBtn = document.getElementById('noticeToggleBtn');
    const noticeModalMask = document.getElementById('noticeModalMask');
    const noticeCloseBtn = document.getElementById('noticeCloseBtn');
    const noticeShowContent = document.getElementById("noticeShowContent");
    const adminNoticeWrap = document.getElementById("adminNoticeWrap");
    const noticeEditInput = document.getElementById("noticeEditInput");
    const saveNoticeBtn = document.getElementById("saveNoticeBtn");
    const clearNoticeBtn = document.getElementById("clearNoticeBtn");

    const pollToggleBtn = document.getElementById("pollToggleBtn");
    const pollMask = document.getElementById("pollMask");
    const pollBox = document.getElementById("pollBox");

    //====================工具函数====================
    /**
     * HTML转义，防止XSS注入，渲染用户输入内容前调用
     * @param {string} str 原始字符串
     * @returns {string} 转义后的安全字符串
     */
    function escapeHtml(str){
        if(!str)return "";
        return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    //====================卡组本地收藏（localStorage）====================
    /** 获取收藏卡组id数组 */
    function getFavDeckIds(){
        const str = localStorage.getItem(DECK_FAV_KEY);
        if(!str) return [];
        try{
            return JSON.parse(str);
        }catch(e){
            return [];
        }
    }
    /** 保存收藏数组到本地存储 */
    function saveFavDeckIds(arr){
        localStorage.setItem(DECK_FAV_KEY, JSON.stringify(arr));
    }
    /** 切换卡组收藏状态 */
    window.toggleDeckFav = function(deckId){
        let list = getFavDeckIds();
        if(list.includes(deckId)){
            list = list.filter(x=>x!==deckId);
        }else{
            list.push(deckId);
        }
        saveFavDeckIds(list);
        loadDeckList(); //刷新列表更新按钮文字
    }

    //====================卡组弹窗事件处理====================
    //打开卡组弹窗
    deckToggleBtn.addEventListener("click",e=>{
        e.preventDefault();
        deckModalMask.style.display = "flex";
        loadDeckList(); //打开弹窗立刻加载卡组列表
    });
    //关闭弹窗按钮
    deckModalClose.addEventListener("click",()=>deckModalMask.style.display="none");
    //点击遮罩黑色背景关闭弹窗
    deckModalMask.addEventListener("click",e=>{
        if(e.target === deckModalMask) deckModalMask.style.display="none";
    })

    /**
     * 加载后端卡组列表，渲染到网格容器
     */
    async function loadDeckList(){
        try{
            const res = await fetch(`${API_BASE}/api/get-decks`);
            const json = await res.json();
            deckListWrap.innerHTML = "";
            if(!json.list||json.list.length===0){
                deckListWrap.innerHTML="<div>暂无卡组</div>";
                return;
            }
            //置顶卡组排前面，普通卡组放后面
            const topList = json.list.filter(d=>d.isTop);
            const normalList = json.list.filter(d=>!d.isTop);
            const allList = [...topList,...normalList];
            const favIds = getFavDeckIds();

            allList.forEach(deck=>{
                const isOwner = deck.uploader_id === userId; //是否本人上传的卡组
                const isFav = favIds.includes(deck.id);      //是否已收藏
                const div = document.createElement("div");
                div.className="deck-item"+(deck.isTop?" top-deck":"");
                div.innerHTML=`
                    <strong>${escapeHtml(deck.name)} ${deck.isTop?"【置顶】":""}</strong>
                    <pre style="font-size:12px;color:#ccc;max-height:120px;overflow:auto;">${escapeHtml(deck.code)}</pre>
                    <div class="deck-btn-row">
                        <button class="deck-btn btn-copy" onclick="copyDeckCode(${JSON.stringify(deck.code).replace(/"/g,'&quot;')})">复制代码</button>
                        <button class="deck-btn fav-btn" onclick="toggleDeckFav(${deck.id})">${isFav?"⭐已收藏":"☆收藏"}</button>
                        ${isOwner?`<button class="deck-btn btn-del-own" onclick="deleteDeck(${deck.id})">删除我的卡组</button>`:""}
                        ${isAdmin?`
                            <button class="deck-btn btn-del-admin" onclick="deleteDeck(${deck.id})">管理员删除</button>
                            <button class="deck-btn btn-set-top" onclick="toggleDeckTop(${deck.id},${deck.isTop})">${deck.isTop?"取消置顶":"设为置顶"}
                        `:""}
                    </div>
                `;
                deckListWrap.appendChild(div);
            })
        }catch(err){
            deckListWrap.innerHTML="<div>加载卡组失败，请检查后端</div>";
        }
    }
    /** 复制卡组代码到剪贴板 */
    window.copyDeckCode = async function(text){
        await navigator.clipboard.writeText(text);
        alert("已复制卡组代码");
    }
    /** 删除卡组，本人/管理员都可以调用 */
    window.deleteDeck = async function(deckId){
        if(!confirm("确定删除这条卡组？")) return;
        const headers = {"Content-Type":"application/json"};
        if(isAdmin) headers["X-Admin-Secret"] = ADMIN_PWD;
        const res = await fetch(`${API_BASE}/api/del-deck`,{
            method:"POST",
            headers: headers,
            body:JSON.stringify({deck_id:deckId,uploader_id:userId})
        });
        const j = await res.json();
        j.ok?(alert("删除成功"),loadDeckList()):alert(j.msg||"删除失败");
    }
    /** 管理员设置/取消置顶卡组 */
    window.toggleDeckTop = async function(deckId,nowTop){
        const res=await fetch(`${API_BASE}/api/deck-set-top`,{
            method:"POST",
            headers:{"Content-Type":"application/json","X-Admin-Secret":ADMIN_PWD},
            body:JSON.stringify({deckId:deckId,isTop:!nowTop})
        })
        const j=await res.json();
        j.ok?loadDeckList():alert(j.msg||"操作失败");
    }
    //提交新卡组按钮点击事件
    addDeckBtn.addEventListener("click",async ()=>{
        const name = deckNameInput.value.trim();
        const code = deckCodeInput.value.trim();
        if (!name) {alert("卡组名称必填");return;}
        if (!code) {alert("卡组代码不能为空");return;}
        const res = await fetch(`${API_BASE}/api/save-deck`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({name,code,uploader_id:userId})
        });
        const j = await res.json();
        if(j.ok){
            alert("卡组提交成功");
            deckNameInput.value="";
            deckCodeInput.value="";

    async function submitCreatePoll(){
        const title = document.getElementById("pollTitle").value.trim();
        const desc = document.getElementById("pollDesc").value.trim();
        const optText = document.getElementById("pollOptions").value.trim();

        const day = Number(document.getElementById("poll_day").value);
        const hour = Number(document.getElementById("poll_hour").value);
        const minute = Number(document.getElementById("poll_minute").value);
        const second = Number(document.getElementById("poll_second").value);

        const MS_DAY = 24 * 60 * 60 * 1000;
        const MS_HOUR = 60 * 60 * 1000;
        const MS_MIN = 60 * 1000;
        const MS_SEC = 1000;

        const totalMs = day*MS_DAY + hour*MS_HOUR + minute*MS_MIN + second*MS_SEC;
        const MAX_MS = 31 * MS_DAY;
        const now = Date.now();

        if(totalMs <= 0){
            alert("请选择投票持续时长！");
            return;
        }
        if(totalMs > MAX_MS){
            alert("最长只能设置31天！");
            return;
        }
        const endTime = now + totalMs;

        if(!title || !optText){
            alert("标题、选项均不能为空");
            return;
        }
        const options = optText.split("\n").filter(s=>s.trim());
        if(options.length<2){
            alert("至少填写2个投票选项");
            return;
        }
        const payload = {title,desc,endTime,options};
        const res=await fetch(`${API_BASE}/api/poll-create`,{
            method:"POST",
            headers:{"Content-Type":"application/json","X-Admin-Secret":ADMIN_PWD},
            body:JSON.stringify(payload)
        })
        const j=await res.json();
        if(j.ok){ alert("新投票创建成功，旧投票数据已自动覆盖"); renderPoll(); }
        else alert(j.msg||"创建失败");
    }
