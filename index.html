<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡兹ba交流群专属网站</title>
    <style>
        :root{
            /* 主菜单按钮：桌面端 240×60 / 字号24；手机端随屏宽等比缩小（最小180px） */
            /* 想调整按钮大小，只需改 --btn-w 一行，高和字号自动等比跟随 */
            --btn-w: clamp(180px, 55vw, 240px);
            --btn-h: calc(var(--btn-w) * 0.25);    /* 高 = 宽 × 0.25（240:60） */
            --btn-fs: calc(var(--btn-w) * 0.1);    /* 字号 = 宽 × 0.1，保持等比 */

            /* 右上角二维码：桌面端 300×375；手机端随屏宽等比缩小（最小160px） */
            --qr-w: clamp(160px, 55vw, 300px);
        }
        html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;}
        .bg-container {
            width: 100%;height: 100%;
            background-image: url("picture/Image.png");
            background-repeat: no-repeat;background-position: center center;background-size: cover;
            position: relative;
        }
        .author-text {
            position: absolute;bottom: 40px;right: 20px;
            color: #ffffff;font-size: 32px;z-index: 8;
        }
        .btn-group {position: absolute;top:12px;left:12px;z-index:10;}

        .menu-btn {
            display: block;width: 200px;height: 50px;
            background-color: #55585a;font-size: 20px;color: #fff;
            text-decoration: none;text-align: center;line-height: 50px;
            margin-bottom: 10px;border: none;cursor: pointer;
            transition: transform 0.1s ease;
        }
        .menu-btn:active {transform: scale(0.9);}
        .menu-btn:hover {background-color: #ff6700;}

        /* 主菜单按钮（含签到面板内按钮），弹窗内的按钮不受影响 */
        .btn-group .menu-btn{
            width: var(--btn-w);
            height: var(--btn-h);
            line-height: var(--btn-h);
            font-size: var(--btn-fs);
        }

        .sign-panel {
            display: none;width: var(--btn-w);background: #2b2b2b;
            padding: 12px;border-radius: 4px;color: #fff;
            margin-bottom: 10px;box-sizing: border-box;
        }
        .sign-input {
            width: 100%;box-sizing: border-box;height: 40px;
            padding: 0 12px;font-size: 15px;background: #3a3a3a;
            border: 1px solid #555;border-radius: 4px;color: #fff;
            outline: none;margin-bottom: 10px;
        }
        .sign-confirm-btn {
            width: 100%;height: 40px;background: #ff6700;color: #fff;
            font-size: 16px;border: none;border-radius: 4px;
            cursor: pointer;margin-bottom: 12px;
        }
        .sign-count {font-size: 13px;color: #ccc;}
        .sign-list {
            display: none;max-height: 200px;overflow-y: auto;
            background: #333;padding: 8px;font-size: 13px;
        }

        .notice-modal-mask {
            display: none;position: fixed;inset: 0;
            background: rgba(0,0,0,0.7);z-index: 9997;
            align-items: center;justify-content: center;
        }
        .notice-modal-box {
            width: 90%;max-width: 520px;background: #2b2b2b;color: #fff;
            border-radius: 6px;padding: 20px;box-sizing: border-box;
        }
        .notice-modal-header {
            display: flex;justify-content: space-between;align-items: center;
            margin-bottom: 12px;padding-bottom: 8px;border-bottom: 1px solid #444;
        }
        .notice-close-btn {background: none;border: none;color: #aaa;font-size:24px;cursor:pointer;}

        .deck-modal-mask{
            display:none;position:fixed;inset:0;
            background:rgba(0,0,0,0.7);z-index:9996;
            align-items:center;justify-content:center;
        }
        .deck-modal-box{
            width:92%;max-width:1200px;max-height:85vh;
            background:#2b2b2b;color:#fff;border-radius:8px;
            display:flex;flex-direction:column;overflow:hidden;
        }
        .deck-modal-header{
            display:flex;justify-content:space-between;align-items:center;
            padding:14px 18px;border-bottom:1px solid #444;
        }
        .deck-modal-close{background:none;border:none;color:#aaa;font-size:24px;cursor:pointer;}
        .deck-modal-body{padding:16px 18px;overflow-y:auto;flex:1;}
        .deck-grid-wrap{display:grid;grid-template-columns: repeat(auto-fill, minmax(320px,1fr));gap:14px;}

        .deck-input {
            width: 100%;box-sizing: border-box;background: #3a3a3a;
            border: 1px solid #555;color: #fff;padding: 8px;
            margin-bottom: 8px;border-radius: 4px;
        }
        .deck-textarea {min-height: 100px;resize: vertical;}
        .deck-item {border: 1px solid #444;padding: 12px;border-radius: 4px;}
        .deck-item.top-deck{border:2px solid #ff6700;background:#382c24;}
        .deck-btn-row {display: flex;gap: 6px;flex-wrap: wrap;margin-top: 8px;}
        .deck-btn {padding: 4px 8px;font-size: 12px;border: none;border-radius: 3px;cursor: pointer;}
        .btn-copy {background:#4488dd;color:#fff;}
        .btn-del-own {background:#dd8822;color:#fff;}
        .btn-del-admin {background:#dd3333;color:#fff;}
        .btn-set-top{background:#22bb55;color:#fff;}
        .fav-btn{
            background:#444;color:#fff;border:none;padding:4px 8px;
            margin:0 4px;cursor:pointer;border-radius:3px;font-size:12px;
        }

        #adminPwdMask {
            display: none;position: fixed;inset: 0;
            background: rgba(0,0,0,0.65);z-index: 9999;
            align-items: center;justify-content: center;
        }
        .admin-trigger-inner {
            background: #fff;color: #111;padding: 22px;border-radius: 6px;
            width: 320px;max-width: 90%;box-sizing: border-box;
        }
        .pwd-input {
            width: 100%;box-sizing: border-box;height: 42px;
            border: 1px solid #ccc;border-radius: 4px;padding: 0 12px;
            margin: 12px 0;font-size: 16px;
        }
        .admin-btn-row {display: flex;gap: 10px;}
        .admin-confirm,.admin-close {flex: 1;height: 40px;border: none;border-radius: 4px;cursor: pointer;}
        .admin-confirm {background: #ff6700;color: white;}
        .admin-close {background: #555;color: white;}
        #clearSignBtn {display: none;width: 100%;box-sizing: border-box;}
        #clearSignBtn.active {display: block;}

        .admin-notice-area {margin-top: 12px;display: none;}
        .admin-notice-area.active {display: block;}
        textarea.notice-edit {
            width: 100%;min-height: 100px;background: #3a3a3a;color: #fff;
            border: 1px solid #555;border-radius: 4px;padding: 8px;box-sizing: border-box;
        }
        /* 右上角二维码：桌面端 300×375，手机端等比缩小 */
        .corner-img {
            width: var(--qr-w);
            height: calc(var(--qr-w) * 1.25);   /* 375/300 = 1.25，保持等比 */
            z-index: 10;object-fit: contain;cursor: pointer;
        }

        .poll-mask{
            display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);
            z-index:9998;align-items:center;justify-content:center;
        }
        .poll-box{
            width:90%;max-width:500px;background:#2b2b2b;color:#fff;
            border-radius:6px;padding:20px;box-sizing:border-box;
            max-height:85vh;overflow-y:auto;
        }
        .poll-close{float:right;font-size:24px;background:none;border:none;color:#aaa;cursor:pointer;}
        .poll-option-item{padding:10px;border:1px solid #555;margin:6px 0;border-radius:4px;cursor:pointer;}
        .poll-option-item:hover{background:#444;}
        .poll-select-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
        .poll-box select{flex:1;padding:6px;background:#3a3a3a;color:#fff;border:1px solid #555;border-radius:4px;}

        .vote-chart-item{margin:6px 0;}
        .vote-chart-line-wrap{display:flex;gap:8px;align-items:center;}
        .vote-chart-name{width:100px;font-size:13px;}
        .vote-chart-bar-bg{flex:1;height:22px;background:#444;border-radius:4px;overflow:hidden;}
        .vote-chart-bar-fill{height:100%;background:#4096ff;}
        .vote-chart-text{width:80px;font-size:13px;}

        .toggle-secret-btn{
            color:#ff6700;font-size:12px;margin-top:6px;cursor:pointer;
            display:none;user-select:none;
        }

        /* ========== 小秘密（由原行内样式提取为类） ========== */
        .secret-float-btn{
            position:fixed;right:12px;top:50%;transform:translateY(-50%);
            width:44px;height:44px;border-radius:50%;background:#992ed8;color:#fff;
            display:flex;align-items:center;justify-content:center;
            font-size:11px;text-align:center;cursor:grab;z-index:9999;
            box-shadow:0 2px 8px #00000077;user-select:none;
        }
        .secret-modal-mask{
            position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:10000;
            display:none;align-items:center;justify-content:center;
        }
        .secret-modal-box{
            background:#1b1b26;border-radius:10px;padding:16px;
            max-width:420px;max-height:85vh;overflow-y:auto;color:#fff;
        }
        .secret-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .secret-modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;}
        .secret-modal-text{font-size:13px;opacity:0.85;margin-bottom:12px;}
    </style>
</head>
<body>
    <!-- 公告弹窗 -->
    <div class="notice-modal-mask" id="noticeModalMask">
        <div class="notice-modal-box">
            <div class="notice-modal-header">
                <h4>📢公告</h4>
                <button class="notice-close-btn" id="noticeCloseBtn">×</button>
            </div>
            <div id="noticeShowContent"></div>
            <div class="admin-notice-area" id="adminNoticeWrap">
                <textarea class="notice-edit" id="noticeEditInput"></textarea>
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <button class="menu-btn" style="width:auto;height:36px;line-height:36px;font-size:14px;" id="saveNoticeBtn">保存公告</button>
                    <button class="menu-btn" style="width:auto;height:36px;line-height:36px;font-size:14px;background:#c0392b;" id="clearNoticeBtn">清空公告</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 卡组管理弹窗 -->
    <div class="deck-modal-mask" id="deckModalMask">
        <div class="deck-modal-box">
            <div class="deck-modal-header">
                <h3>📚卡组管理</h3>
                <button class="deck-modal-close" id="deckModalClose">×</button>
            </div>
            <div class="deck-modal-body">
                <h4>添加新卡组</h4>
                <input class="deck-input" id="deckNameInput" placeholder="卡组名称（必填）">
                <textarea class="deck-input deck-textarea" id="deckCodeInput" placeholder="粘贴卡组代码"></textarea>
                <button class="menu-btn" style="width:100%;height:40px;line-height:40px;" id="addDeckBtn">提交卡组</button>
                <hr style="border-color:#444;margin:16px 0;">

            </div>

    <!-- 管理员密码弹窗 -->
    <div id="adminPwdMask">
        <div class="admin-trigger-inner">
            <h3>请输入密码</h3>
            <input class="pwd-input" id="secretPwdInput" type="password" placeholder="管理员密码">
            <div class="admin-btn-row">
                <button class="admin-confirm" id="pwdConfirm">确认</button>
                <button class="admin-close" id="pwdMaskClose">关闭</button>
            </div>
        </div>
    </div>

    <!-- 投票弹窗 -->
    <div class="poll-mask" id="pollMask">
        <div class="poll-box" id="pollBox"></div>
    </div>

    <!-- 主背景页面 -->
    <div class="bg-container">
        <div class="author-text">作者：生而峥嵘</div>
        <div class="author-text" style="bottom:18px;font-size:12px;opacity:0.7;">版本号：v3.0.0</div>
        <div style="position:absolute;top:10px;right:32.5px;text-align:right;">
            <img class="corner-img" src="picture/erweima.png">
            <div style="margin-top:6px;display:flex;align-items:center;justify-content:flex-end;gap:6px;background:rgba(0,0,0,0.38);padding:3px 8px;border-radius:5px;">
                <button id="copyGroupBtn" style="padding:2px 8px;font-size:12px;border:none;border-radius:4px;background:#2b78d4;color:#fff;cursor:pointer;">复制</button>
                <span style="color:#ffffff;font-size:13px;">QQ群：1067387860</span>
            </div>
            <div id="adminTipText" style="color:#4cd964;font-weight:bold;font-size:14px;margin-top:8px;display:none;">✅已获得管理员权限</div>
            <div id="toggleSecretBtn" class="toggle-secret-btn">🔒 切换小秘密显示</div>
        </div>

        <div class="btn-group">
            <a class="menu-btn" href="https://karsenal.netlify.app/">kards军械库</a>
            <a class="menu-btn" id="signToggleBtn" href="#">签到</a>
            <div class="sign-panel" id="signPanel">
                <input type="text" class="sign-input" id="nicknameInput" placeholder="输入群昵称">
                <button class="sign-confirm-btn" id="confirmSignBtn">确认签到</button>
                <div class="sign-count">今日已签到：<span id="signCountEl">0</span> 人</div>
                <div class="sign-list" id="signList"></div>
                <button class="menu-btn" id="clearSignBtn">清空今日签到</button>
            </div>
            <a class="menu-btn" id="noticeToggleBtn" href="#">群公告</a>
            <a class="menu-btn" id="deckToggleBtn" href="#">卡组管理</a>
            <a class="menu-btn" id="pollToggleBtn" href="#">参与投票</a>
            <a class="menu-btn" id="gameToggleBtn" href="#">小游戏</a>
            <a class="menu-btn" href="https://ohminecraftlauncher.github.io/DIY/">DIY卡牌</a>
        </div>
    </div>

    <!-- 可拖拽悬浮彩蛋按钮 -->
    <div id="secretFloatBtn" class="secret-float-btn">作者的<br>小秘密</div>

    <!-- 彩蛋弹窗 -->
    <div id="secretModalMask" class="secret-modal-mask">
        <div class="secret-modal-box">
            <div class="secret-modal-header">
                <h3 style="margin:0;">✨作者的小秘密</h3>
                <button id="closeSecretModal" class="secret-modal-close">×</button>
            </div>
            <div class="secret-modal-text">
                其实作者也是小猫娘，喵~💖。<br>
                如果你有任何建议或者想法，欢迎随时联系我！<br>
                感谢大家的支持！💖
            </div>
            <img src="picture/luoli.png" style="width:100%;border-radius:6px;">
            <img src="picture/cat-boy.png" style="width:100%;border-radius:6px;">
        </div>
    </div>

<script>
    /* ===================== 常量与全局状态 ===================== */
    const API_BASE = "https://mengdi.de5.net";
    const ADMIN_PWD = 'mengdi12345678';
    const DECK_FAV_KEY = "kards_deck_fav";
    const today = new Date().toISOString().split('T')[0];
    const STORAGE_KEY = 'group_sign_' + today;

    const $ = (id) => document.getElementById(id);

    let userId = localStorage.getItem("local_user_id");
    if(!userId){
        userId = crypto.randomUUID();
        localStorage.setItem("local_user_id", userId);
    }

    let isAdmin = false;
    let qrClick = 0;
    let signClick = 0;
    let triggerTimer = null;
    let preReady = false;

    /* ===================== 通用工具函数 ===================== */
    function escapeHtml(str){
        if(!str) return "";
        return str
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;");
    }

    async function safeFetchJson(url, options){
        const res = await fetch(url, options);
        if(!res.ok){
            let errMsg = `HTTP错误 ${res.status}`;
            try{
                const errJson = await res.json();
                errMsg = errJson.msg || errMsg;
            }catch(e){}
            throw new Error(errMsg);
        }
        return await res.json();
    }

    // 统一封装 POST 请求
    async function postApi(path, data){
        return safeFetchJson(`${API_BASE}/api/${path}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });
    }

    // 通用弹窗绑定：按钮打开 / 按钮关闭 / 点击遮罩关闭
    function bindModal(maskId, openIds, closeIds, onOpen){
        const mask = $(maskId);
        if(!mask) return;
        openIds.forEach(id => $(id)?.addEventListener("click", e => {
            e.preventDefault();
            mask.style.display = "flex";
            onOpen && onOpen();
        }));
        closeIds.forEach(id => $(id)?.addEventListener("click", () => mask.style.display = "none"));
        mask.addEventListener("click", e => {
            if(e.target === mask) mask.style.display = "none";
        });
    }

    // 生成 <option> 列表
    const optionList = (start, end, unit) =>
        Array.from({length: end - start + 1}, (_, i) => `<option value="${start + i}">${start + i}${unit}</option>`).join("");

    /* ===================== 投票模块 ===================== */
    function renderVoteChart(options, counts){
        let html = `<div style="margin:10px 0;"><h4>📊投票可视化统计</h4>`;
        const total = counts.reduce((s, i) => s + i, 0);
        options.forEach((opt, idx) => {
            const cnt = counts[idx] || 0;
            const percent = total === 0 ? 0 : (cnt / total * 100).toFixed(1);
            html += `
            <div class="vote-chart-item">
                <div class="vote-chart-line-wrap">
                    <span class="vote-chart-name">${escapeHtml(opt)}</span>
                    <div class="vote-chart-bar-bg">
                        <div class="vote-chart-bar-fill" style="width:${percent}%"></div>
                    </div>
                    <span class="vote-chart-text">${cnt}票 (${percent}%)</span>
                </div>
            </div>
            `;
        });
        return html + "</div>";
    }

    async function fetchPoll(){
        const json = await safeFetchJson(`${API_BASE}/api/get-poll`);
        if(!json.ok) throw new Error(json.msg || "获取投票失败");
        return json.poll;
    }

    async function createRemotePoll(newPollObj){
        const j = await postApi("poll-create", {...newPollObj, adminSecret: ADMIN_PWD});
        if(!j.ok) throw new Error(j.msg || "创建投票失败");
    }

    async function submitRemoteVote(optIndex){
        const j = await postApi("vote-submit", {uid: userId, opt: optIndex});
        if(!j.ok) throw new Error(j.msg);
        return j.poll;
    }

    async function adminCloseRemotePoll(){
        const j = await postApi("poll-close", {adminSecret: ADMIN_PWD});
        if(!j.ok) throw new Error(j.msg);
        return j.poll;
    }

    async function exportPollDetail(poll){
        if(!poll) return alert("暂无投票数据");
        let text = `【投票标题】${poll.title}\n【投票描述】${poll.desc || ""}\n====选项统计====\n`;
        poll.options.forEach((opt, idx) => text += `${idx + 1}.${opt} 票数:${poll.counts[idx] ?? 0}\n`);
        text += "\n====投票人明细====\n";
        if(poll.voterIds && Array.isArray(poll.voterIds)) poll.voterIds.forEach(item => text += `用户ID:${item.uid} | 选择序号:${item.selectIndex}\n`);
        await navigator.clipboard.writeText(text);
        alert("✅投票明细已经复制剪贴板！");
    }

    async function renderPoll(){
        const pollMask = $("pollMask");
        const pollBox = $("pollBox");
        if(!pollMask || !pollBox) return;

        let poll = null;
        try{
            poll = await fetchPoll();
        }catch(e){
            pollBox.innerHTML = `<div style="color:#f88;">加载投票出错：${e.message}</div>`;
            pollMask.style.display = "flex";
            return;
        }

        const isPollEnd = poll && (poll.endTime && Date.now() > poll.endTime);

        if(!poll || !poll.title || isPollEnd){
            if(isAdmin){
                pollBox.innerHTML = `
                    <button class="poll-close" onclick="document.getElementById('pollMask').style.display='none'">×</button>
                    <h3>创建新投票</h3>
                    <input class="deck-input" id="pollTitle" placeholder="投票标题">
                    <textarea class="deck-input deck-textarea" id="pollDesc" placeholder="投票描述内容"></textarea>
                    <div class="poll-select-row">
                        <select id="poll_day">${optionList(0, 31, "天")}</select>
                        <select id="poll_hour">${optionList(0, 24, "时")}</select>
                        <select id="poll_minute">${optionList(0, 60, "分")}</select>
                        <select id="poll_second">${optionList(0, 59, "秒")}</select>
                    </div>
                    <textarea class="deck-input deck-textarea" id="pollOptionsText" placeholder="选项，一行一个"></textarea>
                    <button class="menu-btn" style="width:100%;height:40px;line-height:40px;" id="createPollBtn">创建投票</button>
                `;
                $("createPollBtn").onclick = async () => {
                    const title = $("pollTitle").value.trim();
                    const desc = $("pollDesc").value.trim();
                    const day = Number($("poll_day").value);
                    const hour = Number($("poll_hour").value);
                    const minute = Number($("poll_minute").value);
                    const second = Number($("poll_second").value);
                    const optRaw = $("pollOptionsText").value.trim();
                    if(!title){ alert("投票标题不能为空"); return; }
                    if(!optRaw){ alert("至少填写一个投票选项"); return; }
                    const options = optRaw.split("\n").map(s => s.trim()).filter(Boolean);

                    const addMs = ((day * 24 + hour) * 60 + minute) * 60 + second;
                    const endTime = Date.now() + Math.max(addMs, 3) * 1000;

                    try{
                        await createRemotePoll({
                            title, desc, options, endTime,
                            forceEnd: false,
                            counts: options.map(() => 0),
                            voterIds: []
                        });
                        alert("✅云端投票创建成功，所有人可见");
                        renderPoll();
                    }catch(err){
                        alert("创建失败：" + err.message);
                    }
                };
            }else{
                pollBox.innerHTML = `<div style="color:#aaa;">暂无投票，请管理员创建投票</div>`;
            }
        }else{
            const hasVoted = poll.voterIds?.some(v => v.uid === userId);
            pollBox.innerHTML = `
                <button class="poll-close" onclick="document.getElementById('pollMask').style.display='none'">×</button>
                <h3>${escapeHtml(poll.title)}</h3>
                <div style="margin-bottom:8px;">${escapeHtml(poll.desc || "")}</div>
                <div style="font-size:13px;color:#aaa;margin-bottom:10px;">结束时间：${new Date(poll.endTime).toLocaleString()}</div>
                ${hasVoted ? `<div style="color:#4cd964;margin-bottom:8px;">✅你已经投过票</div>` : ""}
                ${isAdmin ? `<button id="adminEndPollBtn" class="menu-btn" style="width:100%;height:36px;line-height:36px;margin-bottom:10px;background:#992222;">🔒管理员关闭投票</button>` : ""}
                <div id="pollOptionWrap"></div>
                ${renderVoteChart(poll.options, poll.counts)}
                ${isAdmin ? `<button id="exportPollBtn" class="menu-btn" style="width:100%;height:36px;line-height:36px;margin-top:8px;">导出投票明细复制到剪贴板</button>` : ""}
            `;

            if(isAdmin){
                $("adminEndPollBtn").onclick = async () => {
                    if(!confirm("⚠确认关闭投票？关闭后所有人不能再投票！")) return;
                    try{
                        await adminCloseRemotePoll();
                        alert("✅投票已云端关闭！");
                        renderPoll();
                    }catch(e){
                        alert(e.message);
                    }
                };
                $("exportPollBtn").onclick = () => exportPollDetail(poll);
            }

            const wrap = $("pollOptionWrap");
            poll.options.forEach((opt, idx) => {
                const div = document.createElement("div");
                div.className = "poll-option-item";
                div.textContent = escapeHtml(opt);
                if(!hasVoted){
                    div.onclick = async () => {
                        try{
                            await submitRemoteVote(idx);
                            renderPoll();
                        }catch(err){
                            alert(err.message);
                        }
                    };
                }
                wrap.appendChild(div);
            });
        }
        pollMask.style.display = "flex";
    }

    /* ===================== 卡组模块 ===================== */
    function getFavDeckIds(){
        try{ return JSON.parse(localStorage.getItem(DECK_FAV_KEY)) || []; }
        catch(e){ return []; }
    }
    function saveFavDeckIds(arr){ localStorage.setItem(DECK_FAV_KEY, JSON.stringify(arr)); }

    function toggleDeckFav(deckId){
        const list = getFavDeckIds();
        saveFavDeckIds(list.includes(deckId) ? list.filter(x => x !== deckId) : [...list, deckId]);
        loadDeckList();
    }

    async function loadDeckList(){
        const wrap = $("deckListWrap");
        try{
            const json = await safeFetchJson(`${API_BASE}/api/get-decks`);
            if(!json.ok) throw new Error(json.msg);
            const list = json.list;
            if(!list || list.length === 0){
                wrap.innerHTML = "<div>暂无卡组</div>";
                return;
            }
            const allList = [...list.filter(d => d.isTop), ...list.filter(d => !d.isTop)];
            const favIds = getFavDeckIds();
            wrap.innerHTML = allList.map(deck => {
                const isOwner = deck.uploader_id === userId;
                const isFav = favIds.includes(deck.id);
                return `
                <div class="deck-item${deck.isTop ? " top-deck" : ""}">
                    <strong>${escapeHtml(deck.name)} ${deck.isTop ? "【置顶】" : ""}</strong>
                    <pre style="font-size:12px;color:#ccc;max-height:120px;overflow:auto;">${escapeHtml(deck.code)}</pre>
                    <div class="deck-btn-row" data-id="${deck.id}">
                        <button class="deck-btn btn-copy" data-act="copy">复制代码</button>
                        <button class="deck-btn fav-btn" data-act="fav">${isFav ? "⭐已收藏" : "☆收藏"}</button>
                        ${isOwner ? `<button class="deck-btn btn-del-own" data-act="del">删除我的卡组</button>` : ""}
                        ${isAdmin ? `
                            <button class="deck-btn btn-del-admin" data-act="del">管理员删除</button>
                            <button class="deck-btn btn-set-top" data-act="top" data-top="${!!deck.isTop}">${deck.isTop ? "取消置顶" : "设为置顶"}</button>
                        ` : ""}
                    </div>
                </div>`;
            }).join("");
        }catch(e){
            wrap.innerHTML = `<div style="color:#ff8888;">卡组加载失败：${e.message}</div>`;
        }
    }

    async function copyDeckCode(text){
        await navigator.clipboard.writeText(text);
        alert("已复制卡组代码");
    }

    async function deleteDeck(deckId){
        if(!confirm("确定删除这条卡组？")) return;
        try{
            const j = await postApi("del-deck", {
                deck_id: deckId,
                uploader_id: userId,
                adminSecret: isAdmin ? ADMIN_PWD : ""
            });
            if(!j.ok) throw new Error(j.msg);
            alert("删除成功");
            loadDeckList();
        }catch(err){
            alert("删除失败：" + err.message);
        }
    }

    async function toggleDeckTop(deckId, nowTop){
        if(!isAdmin) return;
        try{
            const j = await postApi("deck-set-top", {deck_id: deckId, isTop: !nowTop, adminSecret: ADMIN_PWD});
            if(!j.ok) throw new Error(j.msg);
            loadDeckList();
        }catch(err){
            alert("置顶操作失败：" + err.message);
        }
    }

    /* ===================== 公告模块 ===================== */
    async function loadNotice(){
        let text = "";
        try{
            const j = await safeFetchJson(`${API_BASE}/api/get-notice`);
            text = j.notice || "";
        }catch(e){
            console.warn("公告加载失败", e);
        }
        $("noticeShowContent").innerHTML = text ? escapeHtml(text).replace(/\n/g, "<br>") : "<p>暂无公告</p>";
        $("noticeEditInput").value = text;
        $("adminNoticeWrap").classList.toggle("active", isAdmin);
        return text;
    }

    async function submitNotice(notice, okMsg, failPrefix){
        if(!isAdmin){ alert("无管理员权限"); return; }
        try{
            const j = await postApi("edit-notice", {notice, adminSecret: ADMIN_PWD});
            if(!j.ok) throw new Error(j.msg);
            alert(okMsg);
            loadNotice();
        }catch(err){
            alert(failPrefix + err.message);
        }
    }

    /* ===================== 签到模块 ===================== */
    function renderSignList(){
        const signCountEl = $("signCountEl");
        const signList = $("signList");
        if(!signCountEl || !signList) return;
        const signData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        signCountEl.textContent = signData.length;
        signList.style.display = signData.length > 0 ? "block" : "none";
        signList.innerHTML = signData.map(x => `<div>👤${escapeHtml(x.name)} ${x.time}</div>`).join("");
    }

    /* ===================== 小秘密模块 ===================== */
    function setSecretBtnVisible(visible){
        $("secretFloatBtn").style.display = visible ? "flex" : "none";
    }

    async function fetchSecretStatus(){
        try{
            const j = await safeFetchJson(`${API_BASE}/api/get-secret`);
            setSecretBtnVisible(!j.hidden);
            return j.hidden;
        }catch(e){
            console.warn("获取小秘密状态失败", e);
            setSecretBtnVisible(true);  // 接口异常默认显示
            return false;
        }
    }

    async function toggleSecretStatus(){
        if(!isAdmin) return;
        try{
            const j = await postApi("toggle-secret", {adminSecret: ADMIN_PWD});
            if(!j.ok) throw new Error(j.msg);
            setSecretBtnVisible(!j.hidden);
            alert(j.hidden ? "✅已隐藏小秘密，所有人不可见" : "✅已显示小秘密");
        }catch(err){
            alert("操作失败：" + err.message);
        }
    }

    /* ===================== 页面初始化与事件绑定 ===================== */
    window.onload = function(){
        /* ---- 悬浮小秘密按钮：拖拽 + 弹窗 ---- */
        const secretFloatBtn = $("secretFloatBtn");
        let drag = false, offX = 0, offY = 0;
        secretFloatBtn.addEventListener("mousedown", e => {
            drag = true; offX = e.offsetX; offY = e.offsetY;
            secretFloatBtn.style.cursor = "grabbing";
        });
        document.addEventListener("mousemove", e => {
            if(!drag) return;
            secretFloatBtn.style.left = (e.clientX - offX) + "px";
            secretFloatBtn.style.top = (e.clientY - offY) + "px";
            secretFloatBtn.style.right = "unset";
            secretFloatBtn.style.transform = "none";
        });
        document.addEventListener("mouseup", () => {
            drag = false;
            secretFloatBtn.style.cursor = "grab";
        });

        /* ---- 各弹窗统一绑定（打开 / 关闭 / 点遮罩关闭） ---- */
        bindModal("deckModalMask",   ["deckToggleBtn"],   ["deckModalClose"],  loadDeckList);
        bindModal("noticeModalMask", ["noticeToggleBtn"], ["noticeCloseBtn"],  loadNotice);
        bindModal("pollMask",        ["pollToggleBtn"],   [],                  renderPoll);
        bindModal("secretModalMask", ["secretFloatBtn"],  ["closeSecretModal"]);

        /* ---- 小游戏：直接跳转同文件夹的游戏大厅 ---- */
        $("gameToggleBtn").addEventListener("click", e => {
            e.preventDefault();
            window.location.href = "./game lobby.html";  // 若实际文件名不同（如 game_lobby.html），只需改这一行
        });

        /* ---- 卡组列表按钮：事件委托 ---- */
        $("deckListWrap").addEventListener("click", e => {
            const btn = e.target.closest("button[data-act]");
            if(!btn) return;
            const id = Number(btn.closest(".deck-btn-row").dataset.id);
            switch(btn.dataset.act){
                case "copy": copyDeckCode(btn.closest(".deck-item").querySelector("pre").textContent); break;
                case "fav":  toggleDeckFav(id); break;
                case "del":  deleteDeck(id); break;
                case "top":  toggleDeckTop(id, btn.dataset.top === "true"); break;
            }
        });

        /* ---- 提交新卡组 ---- */
        $("addDeckBtn").addEventListener("click", async () => {
            const name = $("deckNameInput").value.trim();
            const code = $("deckCodeInput").value.trim();
            if(!name){ alert("卡组名称必填"); return; }
            if(!code){ alert("卡组代码不能为空"); return; }
            try{
                const j = await postApi("save-deck", {id: Date.now(), name, code, uploader_id: userId, isTop: false});
                if(!j.ok) throw new Error(j.msg);
                alert("✅卡组提交成功，云端保存");
                $("deckNameInput").value = "";
                $("deckCodeInput").value = "";
                loadDeckList();
            }catch(err){
                alert("提交失败：" + err.message);
            }
        });

        /* ---- 管理员隐藏入口：连点二维码5次 → 连点签到3次 ---- */
        const qrImg = document.querySelector(".corner-img");
        qrImg.addEventListener("click", () => {
            if(preReady) return;
            qrClick++;
            clearTimeout(triggerTimer);
            triggerTimer = setTimeout(() => {
                qrClick = 0; signClick = 0; preReady = false;
            }, 10000);
            if(qrClick >= 5) preReady = true;
        });

        $("signToggleBtn").addEventListener("click", () => {
            if(!preReady) return;
            signClick++;
            if(signClick >= 3){
                $("adminPwdMask").style.display = "flex";
                qrClick = 0; signClick = 0; preReady = false;
                clearTimeout(triggerTimer);
            }
        });

        /* ---- 管理员密码确认 ---- */
        $("pwdConfirm").addEventListener("click", () => {
            if($("secretPwdInput").value.trim() === ADMIN_PWD){
                isAdmin = true;
                alert("✅已获得管理员权限");
                $("adminPwdMask").style.display = "none";
                $("clearSignBtn").classList.add("active");
                $("adminTipText").style.display = "block";
                $("toggleSecretBtn").style.display = "block";
            }else{
                alert("❌密码错误");
            }
        });
        $("pwdMaskClose").addEventListener("click", () => $("adminPwdMask").style.display = "none");

        /* ---- 签到面板 ---- */
        const signToggleBtn = $("signToggleBtn");
        const signPanel = $("signPanel");
        signToggleBtn.addEventListener("click", function(e){
            e.preventDefault();
            signPanel.style.display = signPanel.style.display === "block" ? "none" : "block";
        });
        document.addEventListener("click", function(e){
            if(!signPanel.contains(e.target) && e.target !== signToggleBtn){
                signPanel.style.display = "none";
            }
        });

        $("confirmSignBtn").addEventListener("click", function(){
            const nickname = $("nicknameInput").value.trim();
            if(!nickname){ alert("请输入群昵称"); return; }
            const signData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            if(signData.some(x => x.name === nickname)){ alert("你今天已经签过到了"); return; }
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
            signData.push({name: nickname, time: timeStr});
            localStorage.setItem(STORAGE_KEY, JSON.stringify(signData));
            renderSignList();
            this.disabled = true;
            this.textContent = "签到成功";
            $("nicknameInput").value = "";
        });

        $("clearSignBtn").addEventListener("click", () => {
            if(!confirm("确定清空今日签到？")) return;
            localStorage.removeItem(STORAGE_KEY);
            renderSignList();
        });

        /* ---- 公告保存 / 清空 ---- */
        $("saveNoticeBtn").addEventListener("click", () => submitNotice($("noticeEditInput").value, "✅公告已保存云端", "保存失败："));
        $("clearNoticeBtn").addEventListener("click", () => {
            if(!isAdmin){ alert("无管理员权限"); return; }
            if(!confirm("确定清空公告，不可恢复？")) return;
            submitNotice("", "✅公告已清空", "清空失败：");
        });

        /* ---- 小秘密显示切换 / 复制群号 ---- */
        $("toggleSecretBtn").addEventListener("click", toggleSecretStatus);
        $("copyGroupBtn").addEventListener("click", async () => {
            await navigator.clipboard.writeText("1067387860");
            alert("已复制QQ群号");
        });

        /* ---- 初始化 ---- */
        fetchSecretStatus();
        renderSignList();
    };
</script>
</body>
</html>
