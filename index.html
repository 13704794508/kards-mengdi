            if(!str)return "";
            return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

        //====================投票可视化渲染函数====================
        function renderVoteChart(options,counts){
            let html = `<div style="margin:10px 0;"><h4>📊投票可视化统计</h4>`;
            const total = counts.reduce((s,i)=>s+i,0);
            options.forEach((opt,idx)=>{
                const cnt = counts[idx]||0;
                const percent = total===0 ? 0 : (cnt/total*100).toFixed(1);
                html += `
                <div class="vote-chart-item">
                    <div class="vote-chart-line-wrap">
                        <span class="vote-chart-name">${escapeHtml(opt)}</span>
                        <div class="vote-chart-bar-bg">
                            <div class="vote-chart-bar-fill" style="width:${percent}%"></div>
                        </div>
                        <span class="vote-chart-text">${cnt}票 (${percent}%)</span>
                    </div>
                </div>
                `;
            })
            html += "</div>";
            return html;
        }

        if(!json.ok) throw new Error(json.msg||"获取投票失败");
        return json.poll;
        }

            headers:{

            "X-Admin-Secret":ADMIN_PWD
            },
            body:JSON.stringify(newPollObj)
        });
        const j = await res.json();
        if(!j.ok) throw new Error(j.msg||"创建投票失败");
        }

        if(!j.ok) throw new Error(j.msg);
        return j.poll;

                    await adminCloseRemotePoll();

        //====================卡组本地收藏（localStorage，仅本机）====================
        function getFavDeckIds(){
            const str = localStorage.getItem(DECK_FAV_KEY);
            if(!str) return [];
            try{return JSON.parse(str);}catch(e){return [];}
        }
        function saveFavDeckIds(arr){
            localStorage.setItem(DECK_FAV_KEY, JSON.stringify(arr));
        }
        window.toggleDeckFav = function(deckId){
            let list = getFavDeckIds();
            if(list.includes(deckId)){
                list = list.filter(x=>x!==deckId);
            }else{
                list.push(deckId);
            }
            saveFavDeckIds(list);
            loadDeckList();
        }

        //====================卡组 对接云端Worker API====================
        async function loadDeckList(){
        const deckListWrap = document.getElementById("deckListWrap");
        let res;
        try{
            res = await fetch(`${API_BASE}/api/get-decks`);
            const json = await res.json();
            if(!json.ok) throw new Error(json.msg);
            const list = json.list;
            deckListWrap.innerHTML = "";
            if(!list||list.length===0){
                deckListWrap.innerHTML="<div>暂无卡组</div>";
                return;
            }
            const topList = list.filter(d=>d.isTop);
            const normalList = list.filter(d=>!d.isTop);
            const allList = [...topList,...normalList];
            const favIds = getFavDeckIds();
            allList.forEach(deck=>{
                const isOwner = deck.uploader_id === userId;
                const isFav = favIds.includes(deck.id);
                const div = document.createElement("div");
                div.className="deck-item"+(deck.isTop?" top-deck":"");
                div.innerHTML=`
                    <strong>${escapeHtml(deck.name)} ${deck.isTop?"【置顶】":""}</strong>
                    <pre style="font-size:12px;color:#ccc;max-height:120px;overflow:auto;">${escapeHtml(deck.code)}</pre>
                    <div class="deck-btn-row">
                        <button class="deck-btn btn-copy" onclick="copyDeckCode(${JSON.stringify(deck.code).replace(/"/g,'&quot;')})">复制代码</button>
                        <button class="deck-btn fav-btn" onclick="toggleDeckFav(${deck.id})">${isFav?"⭐已收藏":"☆收藏"}</button>
                        ${isOwner?`<button class="deck-btn btn-del-own" onclick="deleteDeck(${deck.id})">删除我的卡组</button>`:""}
                        ${isAdmin?`
                            <button class="deck-btn btn-del-admin" onclick="deleteDeck(${deck.id})">管理员删除</button>
                            <button class="deck-btn btn-set-top" onclick="toggleDeckTop(${deck.id},${deck.isTop})">${deck.isTop?"取消置顶":"设为置顶"}
                        `:""}
                    </div>
                `;
                deckListWrap.appendChild(div);
            })
        }catch(e){
            deckListWrap.innerHTML=`<div style="color:#ff8888;">卡组加载失败：${e.message}</div>`;
        }
        }
        window.copyDeckCode = async function(text){
            await navigator.clipboard.writeText(text);
            alert("已复制卡组代码");
        }
        window.deleteDeck = async function(deckId){
            if(!confirm("确定删除这条卡组？")) return;
            try{
                const res = await fetch(`${API_BASE}/api/del-deck`,{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({deck_id:deckId, uploader_id:userId})
                });
                const j = await res.json();
                if(!j.ok) throw new Error(j.msg);
                alert("删除成功");
                loadDeckList();
            }catch(err){
                alert("删除失败："+err.message);
            }
        }
        window.toggleDeckTop = async function(deckId,nowTop){
            if(!isAdmin) return;
            try{
                const res = await fetch(`${API_BASE}/api/deck-set-top`,{
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "X-Admin-Secret":ADMIN_PWD
                },
                body:JSON.stringify({deck_id:deckId, isTop:!nowTop})
                });
                const j = await res.json();
                if(!j.ok) throw new Error(j.msg);
                loadDeckList();
            }catch(err){
                alert("置顶操作失败："+err.message);
            }
        }

        //====================公告对接云端Worker====================
        async function loadNotice(){
        let text = "";
        try{
            const res = await fetch(`${API_BASE}/api/get-notice`);
            const j = await res.json();
            text = j.notice||"";
        }catch(e){
            console.warn("公告加载失败",e);
        }
        noticeShowContent.innerHTML = text ? escapeHtml(text).replace(/\n/g,"<br>") : "<p>暂无公告</p>";
        noticeEditInput.value = text;
        adminNoticeWrap.classList.toggle("active", isAdmin);
        return text;
        }

        //====================签到模块（仅本地localStorage）====================
        function renderSignList() {
            const signCountEl = document.getElementById("signCountEl");
            const signList = document.getElementById("signList");
            if (!signCountEl || !signList) return;
            let signData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            signCountEl.textContent = signData.length;
            signList.style.display = signData.length>0?"block":"none";
            signList.innerHTML = signData.map(x=>`<div>👤${escapeHtml(x.name)} ${x.time}</div>`).join("");
        }

        //====================页面初始化入口====================
        window.onload = async function(){
            const deckModalMask = document.getElementById("deckModalMask");
            const deckModalClose = document.getElementById("deckModalClose");
            const deckToggleBtn = document.getElementById("deckToggleBtn");
            const deckNameInput = document.getElementById("deckNameInput");
            const deckCodeInput = document.getElementById("deckCodeInput");
            const addDeckBtn = document.getElementById("addDeckBtn");
            const deckListWrap = document.getElementById("deckListWrap");

            const adminPwdMask = document.getElementById('adminPwdMask');
            const secretPwdInput = document.getElementById('secretPwdInput');
            const pwdConfirm = document.getElementById('pwdConfirm');
            const pwdMaskClose = document.getElementById('pwdMaskClose');
            const clearSignBtn = document.getElementById('clearSignBtn');
            const signToggleBtn = document.getElementById('signToggleBtn');
            const maintainMask = document.getElementById('maintainMask');
            const bypassMaintainPwd = document.getElementById('bypassMaintainPwd');
            const bypassMaintainBtn = document.getElementById('bypassMaintainBtn');
            const maintainSwitchBtn = document.getElementById('maintainSwitchBtn');
            const adminTipText = document.getElementById("adminTipText");
            const qrImg = document.querySelector('.corner-img');

            const signPanel = document.getElementById('signPanel');
            const confirmSignBtn = document.getElementById('confirmSignBtn');
            const nicknameInput = document.getElementById('nicknameInput');

            const noticeToggleBtn = document.getElementById('noticeToggleBtn');
            const noticeModalMask = document.getElementById('noticeModalMask');
            const noticeCloseBtn = document.getElementById('noticeCloseBtn');
            const noticeShowContent = document.getElementById("noticeShowContent");
            const adminNoticeWrap = document.getElementById("adminNoticeWrap");
            const noticeEditInput = document.getElementById("noticeEditInput");
            const saveNoticeBtn = document.getElementById("saveNoticeBtn");
            const clearNoticeBtn = document.getElementById("clearNoticeBtn");

            const pollToggleBtn = document.getElementById("pollToggleBtn");
            const pollMask = document.getElementById("pollMask");

            const secretFloatBtn = document.getElementById("secretFloatBtn");
            const secretModalMask = document.getElementById("secretModalMask");
            const closeSecretModal = document.getElementById("closeSecretModal");
            //作者小秘密弹窗拖拽简易
            let drag = false, offX=0,offY=0;
            secretFloatBtn.onmousedown=e=>{drag=true;offX=e.offsetX;offY=e.offsetY;secretFloatBtn.style.cursor="grabbing";};
            document.onmousemove=e=>{
                if(!drag)return;
                secretFloatBtn.style.left=(e.clientX-offX)+"px";
                secretFloatBtn.style.top=(e.clientY-offY)+"px";
                secretFloatBtn.style.right="unset";
                secretFloatBtn.style.transform="none";
            };
            document.onmouseup=()=>{drag=false;secretFloatBtn.style.cursor="grab";};
            secretFloatBtn.onclick=()=>{secretModalMask.style.display="flex";};
            closeSecretModal.onclick=()=>{secretModalMask.style.display="none";};
            secretModalMask.onclick=e=>{if(e.target===secretModalMask) secretModalMask.style.display="none";};

            //卡组弹窗事件
            deckToggleBtn.addEventListener("click",e=>{
                e.preventDefault();
                deckModalMask.style.display = "flex";
                loadDeckList();
            });
            deckModalClose.addEventListener("click",()=>deckModalMask.style.display="none");
            deckModalMask.addEventListener("click",e=>{
                if(e.target === deckModalMask) deckModalMask.style.display="none";
            })
            addDeckBtn.addEventListener("click",async ()=>{
                const name = deckNameInput.value.trim();
                const code = deckCodeInput.value.trim();
                if (!name) {alert("卡组名称必填");return;}
                if (!code) {alert("卡组代码不能为空");return;}
                try{
                await fetch(`${API_BASE}/api/save-deck`,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({
                    id:Date.now(),
                    name,
                    code,
                    uploader_id:userId,
                    isTop:false
                    })
                });
                alert("✅卡组提交成功，云端保存");
                deckNameInput.value="";
                deckCodeInput.value="";
                loadDeckList();
                }catch(err){
                alert("提交失败："+err.message);
                }
            });

            //========管理员后门：二维码5次，签到3次触发密码弹窗========
            qrImg.addEventListener("click", function () {
                if(preReady) return;
                qrClick++;
                clearTimeout(triggerTimer);
                triggerTimer = setTimeout(()=>{
                    qrClick = 0;
                    signClick = 0;
                    preReady = false;
                },10000);
                if(qrClick >=5){
                    preReady = true;
                }
            });

            signToggleBtn.addEventListener("click",function(){
                if(!preReady) return;
                signClick++;
                if(signClick >=3){
                    adminPwdMask.style.display="flex";
                    qrClick = 0;
                    signClick = 0;
                    preReady = false;
                    clearTimeout(triggerTimer);
                }
            });

            //密码确认登录管理员
            pwdConfirm.addEventListener('click', ()=>{
                const inputPwd = secretPwdInput.value.trim();
                if(inputPwd === ADMIN_PWD){
                    isAdmin = true;
                    alert('✅已获得管理员权限');
                    adminPwdMask.style.display = 'none';
                    clearSignBtn.classList.add('active');
                    maintainSwitchBtn.style.display="block";
                    adminTipText.style.display="block";
                }else{
                    alert('❌密码错误');
                }
            });
            pwdMaskClose.addEventListener("click",()=>{
                adminPwdMask.style.display="none";
            })

            //签到面板开关
            signToggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                signPanel.style.display = signPanel.style.display === 'block' ? 'none' : 'block';
            });
            document.addEventListener('click',function(e){
                if(!signPanel.contains(e.target) && e.target!==signToggleBtn){
                    signPanel.style.display = "none";
                }
            });
            confirmSignBtn.addEventListener('click', function() {
                let nickname = nicknameInput.value.trim();
                if (!nickname) {alert('请输入群昵称');return;}
                let signData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                if(signData.some(x=>x.name===nickname)){alert('你今天已经签过到了');return;}
                let now = new Date();
                let timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                signData.push({name:nickname,time:timeStr});
                localStorage.setItem(STORAGE_KEY,JSON.stringify(signData));
                renderSignList();
                confirmSignBtn.disabled=true;
                confirmSignBtn.textContent='签到成功';
                nicknameInput.value='';
            });
            clearSignBtn.addEventListener('click',()=>{
                if(!confirm('确定清空今日签到？'))return;
                localStorage.removeItem(STORAGE_KEY);
                renderSignList();
            });

            //公告模块
            noticeToggleBtn.addEventListener('click', e=>{
                e.preventDefault();
                noticeModalMask.style.display='flex';
                loadNotice();
            });

            noticeModalMask.addEventListener('click',e=>{
                if(e.target === noticeModalMask){
                    noticeModalMask.style.display='none';
                }

                if(!isAdmin){ alert("无管理员权限"); return; }

                await fetch(`${API_BASE}/api/edit-notice`,{
                    method:"POST",
                    headers:{
                    "Content-Type":"application/json",
                    "X-Admin-Secret":ADMIN_PWD
                    },
                    body:JSON.stringify({notice:noticeEditInput.value})
                })
                alert("✅公告已保存云端");
                loadNotice();
                }catch(err){
                alert("保存失败："+err.message);
                }
            });
            clearNoticeBtn.addEventListener("click",async ()=>{
                if(!isAdmin){ alert("无管理员权限"); return; }
                if(!confirm("确定清空公告，不可恢复？")) return;
                try{
                await fetch(`${API_BASE}/api/edit-notice`,{
                    method:"POST",
                    headers:{
                    "Content-Type":"application/json",
                    "X-Admin-Secret":ADMIN_PWD
                    },
                    body:JSON.stringify({notice:""})
                })
                alert("✅公告已清空");
                loadNotice();
                }catch(err){
                alert("清空失败："+err.message);
                }
            });

            //投票弹窗
            pollToggleBtn.addEventListener("click",async e=>{
                e.preventDefault();
                pollMask.style.display="flex";
                await renderPoll();
            })
            pollMask.addEventListener("click",e=>{
                if(e.target===pollMask){
                    pollMask.style.display="none";
                }
            });

            //复制群号按钮
            document.getElementById("copyGroupBtn").onclick=async ()=>{
            await navigator.clipboard.writeText("1067387860");
            alert("已复制QQ群号");
            };

            renderSignList();
        }
        </script>
